<html lang="ar" dir="rtl">
<head>
<base target="_blank">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#16233a; --mut:#66708a; --line:#dfe3ec; --bg:#f3f5f9; --card:#fff;
          --main:#1f3864; --ok:#1e7d45; --okbg:#e2f3e8; --warn:#9a6700; --warnbg:#fff3cd;
          --bad:#b3261e; --badbg:#fde7e5; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Tahoma, Arial, sans-serif; background:var(--bg); color:var(--ink); font-size:16px; }
  header { background:var(--main); color:#fff; padding:14px 16px; display:flex; align-items:center; gap:10px; position:sticky; top:0; z-index:5; }
  header h1 { font-size:17px; margin:0; flex:1; }
  header button { background:rgba(255,255,255,.15); color:#fff; border:0; padding:8px 12px; border-radius:8px; font-size:14px; }
  main { padding:14px; max-width:640px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:5px 0; }
  .row span:first-child { color:var(--mut); flex:none; }
  .row span:last-child, .row a { text-align:left; word-break:break-word; }
  a { color:var(--main); }
  input, select, textarea { width:100%; padding:13px; border:1px solid var(--line); border-radius:10px; font-size:16px; font-family:inherit; margin-bottom:10px; background:#fff; color:var(--ink); }
  button.big { width:100%; padding:15px; border:0; border-radius:10px; background:var(--main); color:#fff; font-size:17px; font-family:inherit; margin-bottom:10px; }
  button.big.ok { background:var(--ok); }
  .csheet { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
  .csbox { background:#fff; width:100%; max-width:640px; border-radius:16px 16px 0 0; padding:16px; }
  .csbox a.big, .csbox button.big { display:block; text-align:center; text-decoration:none; margin-top:10px; box-sizing:border-box; }
  .chatbtn { display:flex; justify-content:space-between; align-items:center; width:100%; background:var(--asphalt); color:#fff; border:0; border-radius:16px; padding:13px 16px; font-weight:600; font-size:16px; margin-bottom:10px; cursor:pointer; }
  .chatbtn i { background:var(--stop); font-style:normal; border-radius:20px; padding:2px 10px; font-size:13px; }
  .cthread { display:flex; gap:10px; align-items:center; background:#fff; border-radius:16px; padding:12px; margin-bottom:8px; cursor:pointer; box-shadow:0 2px 10px rgba(21,32,58,.05); }
  .cav { width:42px; height:42px; border-radius:50%; background:#e8efff; color:var(--blue2); display:grid; place-items:center; font-weight:700; flex:none; }
  .cm { flex:1; min-width:0; } .cm b { font-size:15px; } .cm p { margin:3px 0 0; font-size:13px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ctr { font-size:11px; color:var(--mut); text-align:left; } .ctr i { display:block; margin-top:4px; background:var(--stop); color:#fff; font-style:normal; border-radius:20px; padding:1px 7px; text-align:center; }
  .cmsgs { display:flex; flex-direction:column; gap:8px; padding:6px 0 12px; min-height:50vh; }
  .cday { align-self:center; background:#e3e7ee; color:var(--mut); font-size:11px; border-radius:20px; padding:3px 10px; }
  .cb { max-width:80%; padding:9px 12px; border-radius:16px; font-size:15px; line-height:1.55; }
  .cb small { display:block; font-size:10.5px; color:var(--mut); margin-top:3px; text-align:left; }
  .cb.me { align-self:flex-start; background:var(--asphalt); color:#fff; border-bottom-right-radius:4px; } .cb.me small { color:#9fb0d0; }
  .cb.them { align-self:flex-end; background:#fff; border-bottom-left-radius:4px; box-shadow:0 1px 4px rgba(21,32,58,.06); }
  .ctext { white-space:pre-wrap; word-break:break-word; }
  .cchip { display:inline-block; background:#e8efff; color:var(--blue2); border-radius:10px; padding:2px 8px; font-size:12px; font-weight:600; margin-bottom:4px; cursor:pointer; }
  .cchip.bad { background:#fdeaea; color:var(--stop); } .cb.me .cchip { background:rgba(255,255,255,.15); color:#fff; }
  .csys { align-self:center; background:#fff4cc; color:#8a6200; font-size:12px; border-radius:12px; padding:6px 10px; text-align:center; }
  .ccomp { position:sticky; bottom:0; background:var(--bg); padding:8px 0 12px; }
  .ccomp .csel { margin-bottom:6px; padding:8px 10px; font-size:13px; }
  .crow { display:flex; gap:8px; align-items:flex-end; } .crow textarea { margin:0; flex:1; border-radius:18px; padding:10px 14px; resize:none; }
  .csend { width:48px; height:48px; border-radius:50%; border:0; background:var(--go); color:#fff; font-size:20px; flex:none; cursor:pointer; }
  .replycard { border-right:6px solid var(--stop); }
  .replycard .rep { background:#fdeaea; border-radius:14px; padding:10px 12px; margin-bottom:8px; font-size:15px; line-height:1.6; }
  .replycard .rep small { display:block; color:var(--mut); font-size:12px; margin-top:4px; }
  .postline { background:#eef0f4; color:#444; border-radius:8px; padding:6px 8px; font-size:12px; margin-top:6px; }
  .phist { border-top:1px dashed var(--line); padding:8px 0; font-size:14px; }
  .phist .reo { color:var(--ok); font-weight:bold; margin-top:4px; }
  a.waic { display:inline-flex; align-items:center; gap:4px; background:var(--main); color:#fff; border-radius:20px; padding:3px 10px; font-size:13px; text-decoration:none; font-weight:bold; margin-inline-start:6px; white-space:nowrap; }
  .typewarn { background:var(--badbg); color:var(--bad); border-radius:8px; padding:6px 8px; font-size:12px; margin-top:6px; }
  a.big.wa { background:#25D366; color:#fff; border-color:#25D366; font-weight:bold; }
  button.big.ghost { background:#fff; color:var(--bad); border:1px solid var(--bad); }
  button.big.plain { background:#fff; color:var(--main); border:1px solid var(--main); }
  a.big { display:block; text-align:center; text-decoration:none; padding:14px; border:1px solid var(--main); border-radius:10px; margin-bottom:10px; background:#fff; }
  .tag { display:inline-block; padding:3px 10px; border-radius:20px; font-size:13px; background:#e8ecf5; color:var(--main); }
  .tag.ok { background:var(--okbg); color:var(--ok); }
  .tag.warn { background:var(--warnbg); color:var(--warn); }
  .tag.bad { background:var(--badbg); color:var(--bad); }
  .order { cursor:pointer; }
  .order h3 { margin:0 0 6px; font-size:17px; }
  .order p { margin:3px 0; color:var(--mut); font-size:14px; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .step { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
  .step:last-child { border-bottom:0; }
  .dot { width:26px; height:26px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; font-size:13px; background:#e8ecf5; color:var(--mut); }
  .step.done .dot { background:var(--ok); color:#fff; }
  .step.now .dot { background:var(--main); color:#fff; }
  .step.now { font-weight:bold; }
  .msg { padding:12px; border-radius:10px; margin-bottom:12px; background:var(--badbg); color:var(--bad); }
  .msg.info { background:var(--warnbg); color:var(--warn); }
  .hint { color:var(--mut); font-size:14px; margin:0 0 10px; }
  h2 { font-size:16px; margin:0 0 10px; }
  .logrow { padding:9px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .logrow:last-child { border-bottom:0; }
  .logrow b { display:block; font-size:15px; }
  .logrow small { color:var(--mut); }
  #busy { position:fixed; inset:0; background:rgba(255,255,255,.75); display:none; align-items:center; justify-content:center; z-index:20; font-size:18px; color:var(--main); }
  .dl { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:10px; }
  .dl .top b { font-size:15px; }
  .dl .row { font-size:14px; padding:3px 0; }
  .dl.done { background:var(--okbg); border-color:#bfe3cb; }
  .dl.bad { background:var(--badbg); border-color:#f3c2bd; }
  .ph { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .ph span { flex:1; }
  .ph button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 12px; font-family:inherit; font-size:14px; }
  .ph button.del { color:var(--bad); border-color:var(--bad); }
  #viewer { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:30; padding:16px; }
  #viewer img { max-width:100%; max-height:100%; border-radius:8px; }
  .datebar { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .datebar button { background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:18px; color:var(--main); }
  .datebar input { margin:0; text-align:center; flex:1; }
  .chips { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .chips button { background:#fff; border:1px solid var(--line); border-radius:20px; padding:7px 14px; font-family:inherit; font-size:14px; color:var(--main); }
  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px; }
  .tiles button { background:#fff; border:1px solid var(--line); border-radius:12px; padding:8px 4px; font-family:inherit; font-size:13px; color:#555; }
  .tiles button b { display:block; font-size:22px; color:var(--main); }
  .tiles button.on { outline:3px solid var(--main); }
  .tiles .t-fin b { color:#b26a00; } .tiles .t-closed b { color:var(--ok); } .tiles .t-issue b { color:var(--bad); } .tiles .t-run b { color:#1565c0; }
  .filters { display:flex; gap:8px; margin-bottom:10px; } .filters select { flex:1; margin:0; }
  .moneybar { background:#fff4e0; color:#8a5200; border-radius:10px; padding:10px; margin-bottom:10px; font-weight:bold; }
  .latetag { display:inline-block; background:var(--badbg); color:var(--bad); border-radius:20px; padding:2px 8px; font-size:12px; margin-inline-start:6px; }
  .card.order .lastline { color:#777; font-size:12px; }
  .card.order.sel { outline:3px solid var(--main); }
  .selbox { width:22px; height:22px; margin:0; margin-inline-end:8px; flex:none; }
  .sum { background:#fff; border:2px solid var(--main); border-radius:14px; padding:14px; margin-bottom:12px; }
  .sum h3 { margin:0 0 10px; font-size:16px; color:var(--main); }
  .kv { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; }
  .kv div { background:var(--bg); border-radius:10px; padding:8px 4px; font-size:12px; color:var(--mut); }
  .kv b { display:block; font-size:18px; color:var(--ink); }
  .mini { display:flex; justify-content:space-between; gap:8px; font-size:13px; padding:6px 0; border-top:1px dashed var(--line); }
  .mini span:last-child { font-weight:bold; }
  .st { margin-top:10px; padding:8px; border-radius:10px; text-align:center; font-weight:bold; font-size:14px; }
  .st.wait { background:var(--warnbg); color:var(--warn); } .st.ok { background:var(--okbg); color:var(--ok); }
  .cr { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
  .cr .top { display:flex; justify-content:space-between; align-items:center; }
  .cr h4 { margin:0; font-size:16px; }
  .cr .warnl { font-size:12px; color:var(--bad); margin-top:6px; }
  .chips button.on { background:var(--main); color:#fff; border-color:var(--main); }
  .empty { text-align:center; color:var(--mut); padding:30px 10px; }

  #editor { position:fixed; inset:0; background:#111; z-index:40; display:flex; flex-direction:column; padding:12px; gap:8px; overflow:auto; }
  #editor .ed-top { display:flex; justify-content:space-between; align-items:center; color:#fff; font-size:17px; }

  #editor .ed-bar { display:flex; gap:8px; }

  #editor input { font-size:17px; }
  .ph { flex-wrap:wrap; }
  .ph .ph-name { display:flex; flex-direction:column; flex:1; min-width:120px; }
  .ph .ph-name small { color:#6b7280; }
  .ph .ph-btns { display:flex; gap:6px; }
  main.wide { max-width:1200px; }
  .db-filters { display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:#fff; border:1px solid var(--line); border-radius:12px; padding:10px; margin-bottom:12px; position:relative; }
  .db-filters select { width:auto; margin:0; padding:9px 10px; font-size:14px; }
  .db-date { display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:14px; background:#fff; cursor:pointer; color:var(--ink); font-family:inherit; }
  .db-chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:7px 12px; font-size:13px; cursor:pointer; font-family:inherit; color:var(--main); }
  .db-chip.on { background:var(--main); color:#fff; border-color:var(--main); }
  .db-cal { position:absolute; top:58px; right:10px; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.15); padding:12px; width:310px; z-index:8; }
  .db-cal .pre { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .db-cal .mh { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .db-cal .mh button { border:1px solid var(--line); background:#fff; border-radius:8px; width:34px; height:30px; font-size:16px; cursor:pointer; }
  .db-cal table { width:100%; border-collapse:collapse; }
  .db-cal th { font-size:11px; color:var(--mut); font-weight:normal; padding:3px 0; }
  .db-cal td { text-align:center; font-size:13px; padding:6px 0; cursor:pointer; border-radius:6px; }

  .db-cal td.edge.has::after { background:#fff; }
  .db-kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:12px; }
  .db-kpi { background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .db-kpi .l { font-size:13px; color:var(--mut); display:flex; align-items:center; gap:6px; }
  .db-kpi .v { font-size:26px; font-weight:700; margin-top:4px; color:#0b0b0b; }
  .db-kpi .s { font-size:12px; color:#898781; margin-top:2px; }
  .db-dot { width:9px; height:9px; border-radius:50%; display:inline-block; flex:none; }

  .db-card h3 { margin:0 0 2px; font-size:15px; }
  .db-card .sub { font-size:12px; color:#898781; margin-bottom:8px; }
  .db-leg { display:flex; gap:14px; font-size:12px; color:#52514e; margin-bottom:6px; flex-wrap:wrap; }
  .db-leg span { display:flex; align-items:center; gap:5px; }

  .db-it small { color:#898781; display:block; font-size:12px; }

  /* ===== الشكل الجديد: خط السير + الأختام ===== */
  :root { --asphalt:#15203a; --road:#26324f; --yellow:#f5b700; --go:#13a35a; --stop:#e5484d; --blue2:#2f6bff;
          --ink:#15203a; --mut:#6c7690; --line:#e3e7ee; --bg:#f4f6f9; --main:#15203a; --ok:#13a35a; --okbg:#e7f7ed; --bad:#e5484d; --badbg:#fdeaea; }
  body { font-family:'Readex Pro', Tahoma, Arial, sans-serif; }
  input, select, textarea, button { font-family:inherit; }
  header { background:var(--asphalt); padding:14px 16px; }
  header h1 { font-weight:600; font-size:18px; }
  header button { border-radius:12px; }
  main { padding:0 14px 24px; }
  .card { border:0; border-radius:20px; box-shadow:0 2px 10px rgba(21,32,58,.06); }
  input, select, textarea { border-radius:14px; border-color:var(--line); }
  button.big, a.big { border-radius:16px; font-weight:600; }
  button.big.ok { box-shadow:0 6px 16px rgba(19,163,90,.25); }
  .tag { border-radius:8px; font-weight:500; font-size:12px; }
  .msg { border-radius:16px; }
  /* الشريط الغامق فوق القايمة */
  .band { background:var(--asphalt); color:#fff; margin:0 -14px 14px; padding:4px 16px 0; border-radius:0 0 26px 26px; }
  .daystrip { display:flex; position:relative; }
  .daystrip:after { content:""; position:absolute; bottom:13px; left:0; right:0; border-top:2px dashed rgba(245,183,0,.55); }
  .daystrip button { flex:1; background:none; border:0; color:#8d9cbc; font-size:12px; padding:6px 0 26px; position:relative; cursor:pointer; }
  .daystrip button b { display:block; font-size:18px; font-weight:500; color:#c9d3e8; }
  .daystrip button.on { color:var(--yellow); }
  .daystrip button.on b { color:#fff; font-size:24px; font-weight:700; }
  .daystrip button.on:after { content:""; position:absolute; bottom:7px; left:50%; margin-left:-7px; width:14px; height:14px; border-radius:50%; background:var(--yellow); box-shadow:0 0 0 5px rgba(245,183,0,.25); z-index:1; }
  .calrow { padding:4px 0 12px; }
  .calrow input.daypick { margin:0; background:#fff; color:var(--ink); text-align:center; font-size:17px; border:0; border-radius:14px; padding:11px; }
  .tally { display:flex; justify-content:space-between; background:var(--road); margin:0 -16px; padding:11px 16px; font-size:13px; color:#c9d3e8; border-radius:0 0 26px 26px; }
  .tally b { color:#fff; font-weight:600; }
  .band + input[type=search] { margin-top:0; }
  /* خط السير */
  .stop { display:flex; gap:10px; }
  .rail { width:26px; flex:none; display:flex; flex-direction:column; align-items:center; }
  .rail .n { width:20px; height:20px; border-radius:50%; border:3px solid var(--line); background:#fff; margin-top:18px; z-index:1; flex:none; }
  .rail .l { flex:1; width:3px; background:var(--line); margin-bottom:-12px; }

/* ---------- المشرف: خط السير المصغّر لكل مسؤول تسليم ---------- */
function courierRails(app, list) {
  var by = {}, order = [];
  list.forEach(function (v) { var k = v.courierName || '-'; if (!by[k]) { by[k] = []; order.push(k); } by[k].push(v); });
  if (!order.length) return;
  var cat = function (v) { return !isOpen(v) ? 0 : (v.status === 'مشكلة' || v.retPending) ? 1 : v.status === 'جاري' ? 2 : 3; };
  var cards = order.map(function (k) {
    var vs = by[k].slice();
    vs.sort(function (a, b) { return cat(a) - cat(b) || String(a.last ? a.last.time : '').localeCompare(String(b.last ? b.last.time : '')); });
    var done = vs.filter(function (v) { return cat(v) === 0; }).length;
    var cur = vs.filter(function (v) { return cat(v) === 2; })[0];
    var bad = vs.filter(function (v) { return cat(v) === 1; })[0];
    // ترتيب مسؤولي التسليم: مشكلة، شغال، لسه ما بدأش، خلّص يومه
    var rank = bad ? 0 : cur ? 1 : done === vs.length ? 3 : done ? 1 : 2;
    var money = 0, lastT = '';
    vs.forEach(function (v) { if (v.collected && v.collected.amount != null) money += Number(v.collected.amount) || 0;
      var t = v.last && hhmm(v.last.time); if (t && t > lastT) lastT = t; });
    var badge = bad ? el('span', { cls: 'badge b-bad', text: '⚠ مشكلة: ' + (bad.customer || '') })
      : done === vs.length ? el('span', { cls: 'badge b-ok', text: '✓ خلّص يومه' })
      : cur ? el('span', { cls: 'badge b-run', text: '● شغال: ' + (cur.customer || '') })
      : done ? el('span', { cls: 'badge b-run', text: '● شغال' }) : el('span', { cls: 'badge b-new', text: 'لسه ما بدأش' });
    var sub;
    if (done === vs.length) sub = vs.length === 1 ? 'زيارة واحدة · اتسلمت' : vs.length + ' زيارات · كلها اتسلمت';
    else if (bad) sub = done + ' من ' + vs.length + ' · ' + (bad.status === 'مشكلة' ? 'مشكلة - مستنية قرارك' : 'مرتجع ما اتسلمش للمخزن');
    else if (cur) { var st = stepsOf(cur), sx = st[Math.min(cur.step, st.length - 1)]; sub = done + ' من ' + vs.length + ' · الخطوة ' + (Math.min(cur.step, st.length - 1) + 1) + ' من ' + st.length + (sx ? ': ' + sx.title : ''); }
    else sub = done + ' من ' + vs.length;
    var rail = el('div', { cls: 'lrail' }, []);
    vs.forEach(function (v, i) {
      var c = cat(v), cls = c === 0 ? 'd' : c === 1 ? 'b' : v === cur ? 'c' : 'n';
      if (i) rail.appendChild(el('div', { cls: 'ln' + (c === 0 ? ' d' : '') }));
      var lbl = c === 0 ? (v.last ? hhmm(v.last.time) : '✓') : c === 1 ? (v.status === 'مشكلة' ? 'مشكلة' : 'مرتجع') : v === cur ? 'دلوقتي' : 'لسه';
      rail.appendChild(el('div', { cls: 'st ' + cls, title: v.customer || '', onclick: function (e) { e.stopPropagation(); S.key = v.vk; showVisit(); } }, [
        el('i', { text: c === 0 ? '✓' : c === 1 ? '!' : v === cur ? '' : String(i + 1) }),
        el('span', { text: v.customer || v.key }), el('small', { text: lbl })]));
    });
    return { rank: rank, node: el('div', { cls: 'cour', onclick: function () { S.fCourier = k; showList(); } }, [
      el('div', { cls: 'h' }, [el('b', { text: k }), badge]), el('div', { cls: 'csub', text: sub }), rail,
      el('div', { cls: 'f' }, [el('span', {}, [document.createTextNode('آخر خطوة '), el('b', { text: lastT || '-' })]),
        el('span', {}, [document.createTextNode('محصّل '), el('b', { text: fmtN(Math.round(money)) + ' ج' })])])]) };
  });
  cards.sort(function (a, b) { return a.rank - b.rank; });
  app.appendChild(el('div', { cls: 'legend' }, [
    el('span', {}, [el('i', { cls: 'd' }), document.createTextNode('خلصت')]), el('span', {}, [el('i', { cls: 'c' }), document.createTextNode('شغال عليها')]),
    el('span', {}, [el('i', { cls: 'b' }), document.createTextNode('مشكلة')]), el('span', {}, [el('i'), document.createTextNode('لسه')])]));
  cards.forEach(function (c) { app.appendChild(c.node); });
}

function openCamera(cb) {
  var f = el('input', { type: 'file', accept: 'image/*', capture: 'environment', style: 'display:none' });
  f.onchange = function () { var file = f.files && f.files[0]; f.remove(); if (file) cb(file); };
  document.body.appendChild(f);
  f.click();
}
function loadImg(src) {
  return new Promise(function (res, rej) {
    var img = new Image();
    img.onload = function () { res(img); };
    img.onerror = function () { rej(new Error('تعذر قراءة الصورة')); };
    img.src = src;
  });
}
// o = { title, name, src (لصورة مرفوعة) أو file (صورة جديدة), onSave(b64|null, name) }
// b64 = null معناها الصورة نفسها ماتغيرتش (تعديل الاسم بس)
function photoEditor(o) {
  var st = { angle: 0, img: null, changed: !!o.file, url: null };
  var ov = el('div', { id: 'editor' }, []);
  var cv = el('canvas', {});
  var nameIn = el('input', { type: 'text', placeholder: 'اسم الصورة', value: o.name || '' });
  var close = function () { if (st.url) URL.revokeObjectURL(st.url); ov.remove(); };
  var draw = function () {
    if (!st.img) return;
    var max = 1280, w = st.img.width, h = st.img.height;
    if (w > max || h > max) { var k = Math.min(max / w, max / h); w = Math.round(w * k); h = Math.round(h * k); }
    var rot = st.angle % 180 !== 0;
    cv.width = rot ? h : w; cv.height = rot ? w : h;
    var g = cv.getContext('2d');
    g.translate(cv.width / 2, cv.height / 2); g.rotate(st.angle * Math.PI / 180);
    g.drawImage(st.img, -w / 2, -h / 2, w, h);
  };
  var setFile = function (file) {
    if (st.url) URL.revokeObjectURL(st.url);
    st.url = URL.createObjectURL(file); st.angle = 0; st.changed = true;
    return loadImg(st.url).then(function (img) { st.img = img; draw(); });
  };
  var go = o.file ? setFile(o.file) : loadImg(o.src).then(function (img) { st.img = img; draw(); });
  go.catch(function (e) { alert(e.message); close(); });
  ov.appendChild(el('div', { cls: 'ed-top' }, [el('b', { text: o.title || 'الصورة' }),
    el('button', { cls: 'ed-x', text: '✕', onclick: close })]));
  ov.appendChild(el('div', { cls: 'ed-img' }, [cv]));
  ov.appendChild(el('div', { cls: 'ed-bar' }, [
    el('button', { text: '↻ تدوير', onclick: function () { st.angle = (st.angle + 90) % 360; st.changed = true; draw(); } }),
    el('button', { text: '📷 إعادة التصوير', onclick: function () { openCamera(function (f) { setFile(f); }); } })
  ]));
  ov.appendChild(el('p', { cls: 'hint', style: 'color:#ddd;margin:6px 0 2px', text: 'اسم الصورة' }));
  ov.appendChild(nameIn);
  ov.appendChild(el('button', { cls: 'big ok', text: o.file ? 'رفع الصورة' : 'حفظ التعديل', onclick: function () {
    var nm = nameIn.value.trim();
    if (!nm) { nameIn.focus(); return alert('اكتب اسم الصورة'); }
    var b64 = st.changed ? cv.toDataURL('image/jpeg', 0.7).split(',')[1] : null;
    close();
    o.onSave(b64, nm);
  } }));
  document.body.appendChild(ov);
}

    dbInteract(tr, tipRows(c.name, [['الزيارات', c.visits], ['✓ اتسلمت', c.done + ' (' + p + '%)'], ['! مشاكل', c.issues], ['↩ مرتجعات', c.returns],
        ['كيلومترات', K.km === null ? '—' : fmtN(c.km)], ['التحصيل', fmtN(c.money) + ' ج'], ['أول / آخر خطوة', (c.first || '-') + ' / ' + (c.last || '-')]],
        (D.from === D.to ? '' : 'أول وآخر خطوة = متوسط ' + c.days + ' يوم شغل. ') + 'كليك: فلتر على المسؤول تسليم · دبل كليك: زياراته'),
      function () { go({ courier: c.phone }); },
      function () { dbDetails('زيارات ' + c.name, function (v) { return v.phone === c.phone; }); });
    ct.appendChild(tr);
  });
  var cc = el('div', { cls: 'card db-card' }, [el('h3', { text: 'أداء مسؤولي التسليم' }), el('div', { cls: 'sub', text: 'وقّف على المسؤول تسليم تشوف ملخصه · كليك: فلتر عليه · دبل كليك: زياراته' })]);
  cc.appendChild(D.couriers.length ? el('div', { cls: 'db-scroll' }, [ct]) : el('div', { cls: 'db-empty', text: 'مفيش بيانات' }));
  app.appendChild(cc);

  // ===== محتاج تدخّل + الكيلومترات والتحصيل =====
  var IC = { issue: ['!', '#d03b3b', 'افتح'], ret: ['↩', '#ec835a', 'افتح'], fin: ['⏱', '#b07800', 'قفل'], sub: ['⏱', '#b07800', 'راجع'] };
  var ac = el('div', { cls: 'card db-card' }, [el('h3', { text: 'محتاج تدخّل' }),
    el('div', { cls: 'sub', text: 'مشاكل، مرتجعات ما اتسلمتش، مالية متأخرة أكتر من 48 ساعة، واشتراكات مستنية مراجعة' })]);
  if (!D.attention.length) ac.appendChild(el('div', { cls: 'db-empty', text: '✓ مفيش حاجة مستنياك في الفترة دي' }));
  D.attention.forEach(function (a) {
    var ic = IC[a.kind];
    var TIP = { issue: 'المسؤول تسليم بلّغ عن مشكلة في الزيارة دي ومستنية قرارك.', ret: 'فيه مرتجع من الزيارة دي ما اتسلمش للمخزن لسه.',
                fin: 'الزيارة اتسلمت من أكتر من 48 ساعة ولسه ما اتقفلتش مع المالية.', sub: 'المسؤول تسليم حصّل الاشتراك، ومستني تراجع الإيصال وتقفل.' };
    var it = el('div', { cls: 'db-it' }, [
      el('div', {}, [el('b', { text: ic[0] + ' ', style: 'color:' + ic[1] }), document.createTextNode(a.text), el('small', { text: a.sub })]),
      a.vk ? el('button', { cls: 'db-chip', text: ic[2], onclick: function () { dbOpenVisit(a.vk); } }) : null]);
    ac.appendChild(dbInteract(it, tipRows(a.text.split(' — ')[0], [], TIP[a.kind] + '<br>دبل كليك: فتح الزيارة'), null, a.vk ? function () { dbOpenVisit(a.vk); } : null));
  });
  var kc = el('div', { cls: 'card db-card' }, [el('h3', { text: 'الكيلومترات يوم بيوم' }),
    el('div', { cls: 'sub', text: 'إجمالي ' + (f.courier ? 'المسؤول تسليم' : 'كل مسؤولي التسليم') + ' · وقّف على اليوم تشوف التحصيل · دبل كليك: زياراته' })]);
  var kSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  kSvg.setAttribute('width', '100%'); kSvg.setAttribute('height', '200');
  kc.appendChild(kSvg);
  app.appendChild(el('div', { cls: 'db-g2' }, [ac, kc]));
  drawKm(kSvg, D.daily, K.km === null);
}

// فتح زيارة من الداش بورد (والرجوع للداش بورد)
function dbOpenVisit(vk) {
  run(call('getData', S.phone, S.pin), 'جاري الفتح...').then(function (d) {
    apply(d); S.key = vk; S.fromDash = true;
    if (current()) showVisit(); else { alert('الزيارة دي مش موجودة. اعمل تحديث'); }
  }).catch(function () {});
}

// كاليندر: يوم واحد أو فترة + اختيارات سريعة
function calendarBox(D, onPick) {
  var has = {}; (D.workDays || []).forEach(function (x) { has[x] = 1; });
  var st = { a: D.from, b: D.to, pick: null, m: new Date(D.to.slice(0, 4), Number(D.to.slice(5, 7)) - 1, 1) };
  var box = el('div', { cls: 'db-cal' }, []);
  var iso = function (d) { return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); };
  var T = D.today, td = new Date(T.slice(0, 4), Number(T.slice(5, 7)) - 1, Number(T.slice(8)));
  var add = function (n) { var x = new Date(td); x.setDate(x.getDate() + n); return iso(x); };
  var dow = td.getDay();   // الأحد = 0
  var presets = [['النهارده', T, T], ['امبارح', add(-1), add(-1)], ['الأسبوع ده', add(-dow), T],
                 ['الشهر ده', T.slice(0, 8) + '01', T], ['آخر 30 يوم', add(-29), T]];
  function draw() {
    box.innerHTML = '';
    box.appendChild(el('div', { cls: 'pre' }, presets.map(function (p) {
      return el('button', { cls: 'db-chip' + (st.a === p[1] && st.b === p[2] ? ' on' : ''), text: p[0], onclick: function () { onPick(p[1], p[2]); } });
    })));
    box.appendChild(el('div', { cls: 'mh' }, [
      el('button', { text: '›', onclick: function () { st.m = new Date(st.m.getFullYear(), st.m.getMonth() - 1, 1); draw(); } }),
      el('b', { text: MONTHS[st.m.getMonth()] + ' ' + st.m.getFullYear() }),
      el('button', { text: '‹', onclick: function () { st.m = new Date(st.m.getFullYear(), st.m.getMonth() + 1, 1); draw(); } })]));
    var t = el('table', {}, [el('tr', {}, ['س', 'ح', 'ن', 'ث', 'ر', 'خ', 'ج'].map(function (x) { return el('th', { text: x }); }))]);
    var y = st.m.getFullYear(), m = st.m.getMonth(), n = new Date(y, m + 1, 0).getDate();
    var off = (new Date(y, m, 1).getDay() + 1) % 7, tr = el('tr', {}, []);
    for (var i = 0; i < off; i++) tr.appendChild(el('td', { cls: 'e' }));
    for (var d = 1; d <= n; d++) {
      (function (d) {
        var k = iso(new Date(y, m, d));
        var a = st.pick || st.a, b = st.pick || st.b;
        var c = (has[k] ? 'has ' : '') + (k === T ? 'tdy ' : '') + (k === a || k === b ? 'edge' : (k > a && k < b ? 'in' : ''));
        tr.appendChild(el('td', { cls: c, text: d, onclick: function () {
          if (!st.pick) { st.pick = k; draw(); return; }
          var x = st.pick < k ? st.pick : k, z = st.pick < k ? k : st.pick;
          st.pick = null; onPick(x, z);
        } }));
      })(d);
      if (tr.children.length === 7) { t.appendChild(tr); tr = el('tr', {}, []); }
    }
    if (tr.children.length) t.appendChild(tr);
    box.appendChild(t);
    box.appendChild(el('div', { style: 'font-size:12px;color:#898781;margin-top:6px', text: st.pick ? 'دلوقتي دوس على يوم النهاية (أو نفس اليوم ليوم واحد)' : 'دوس على يوم البداية وبعدين يوم النهاية · دوستين على نفس اليوم = يوم واحد' }));
  }
  draw();
  return box;
}

function svgEl(tag, attrs) { var e = document.createElementNS('http://www.w3.org/2000/svg', tag); Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); }); return e; }
function niceMax(v) { var raw = Math.max(v, 4) / 4, p = Math.pow(10, Math.floor(Math.log10(raw))); var s = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10], st = 10 * p; for (var i = 0; i < s.length; i++) if (s[i] * p >= raw) { st = s[i] * p; break; } return st * 4; }

// عواميد متراكمة: اتسلمت / مفتوحة / مشكلة (من اليمين للشمال = الأقدم يمين)
function drawTrend(svg, daily, onDay) {
  var W = svg.clientWidth || 600, H = 230, pb = 26, pt = 8, pl = 6, pr = 34;
  var max = niceMax(Math.max.apply(null, daily.map(function (d) { return d.done + d.open + d.issue; }).concat([1])));
  var nd = daily.length, iw = (W - pl - pr) / nd, bw = Math.max(4, Math.min(34, iw * 0.6));
  [0, max / 4, max / 2, 3 * max / 4, max].forEach(function (v, i) {
    var y = H - pb - (v / max) * (H - pb - pt);
    svg.appendChild(svgEl('line', { x1: pl, x2: W - pr, y1: y, y2: y, stroke: i ? '#e1e0d9' : '#c3c2b7' }));
    var t = svgEl('text', { x: W - pr + 6, y: y + 4, 'font-size': 11, fill: '#898781' }); t.textContent = Math.round(v); svg.appendChild(t);
  });
  var every = Math.ceil(nd / Math.max(1, Math.floor((W - pl - pr) / 46)));
  daily.forEach(function (d, i) {
    var x = W - pr - (i + 0.5) * iw - bw / 2, y0 = H - pb;
    var segs = [[d.done, '#0ca30c'], [d.open, '#fab219'], [d.issue, '#d03b3b']].filter(function (s) { return s[0] > 0; });
    segs.forEach(function (s, k) {
      var hh = s[0] / max * (H - pb - pt), y = y0 - hh, top = k === segs.length - 1;
      svg.appendChild(svgEl('rect', { x: x, y: y, width: bw, height: Math.max(hh - (top ? 0 : 2), 1), rx: top ? 4 : 0, fill: s[1] }));
      if (top && hh > 4) svg.appendChild(svgEl('rect', { x: x, y: y + 4, width: bw, height: Math.max(hh - 4 - (k ? 0 : 0), 0), fill: s[1] }));
      y0 = y;
    });
    if (i % every === 0) { var t = svgEl('text', { x: x + bw / 2, y: H - 8, 'font-size': 11, fill: '#52514e', 'text-anchor': 'middle' }); t.textContent = dm(d.iso); svg.appendChild(t); }
    var hit = svgEl('rect', { x: W - pr - (i + 1) * iw, y: pt, width: iw, height: H - pb - pt, fill: 'transparent', style: 'cursor:pointer' });
    dbInteract(hit, tipRows(DAYS[new Date(d.iso + 'T12:00:00Z').getUTCDay()] + ' ' + dmy(d.iso),
        [['✓ اتسلمت', d.done], ['○ مفتوحة', d.open], ['! مشكلة', d.issue], ['الإجمالي', d.done + d.open + d.issue]],
        (daily.length > 1 ? 'كليك: الداش بورد لليوم ده بس · ' : '') + 'دبل كليك: زيارات اليوم'),
      daily.length > 1 ? function () { onDay(d.iso); } : null,
      function () { dbDetails('زيارات ' + dmy(d.iso), function (v) { return v.iso === d.iso; }); });
    svg.appendChild(hit);
  });
}

// خط الكيلومترات يوم بيوم
function drawKm(svg, daily, hidden) {
  var W = svg.clientWidth || 400, H = 200, pb = 26, pt = 10, pl = 6, pr = 40, ins = 18;
  if (hidden) { var t0 = svgEl('text', { x: W / 2, y: H / 2, 'font-size': 13, fill: '#898781', 'text-anchor': 'middle' }); t0.textContent = 'الكيلومترات مش بتتفلتر بنوع العمل أو المخزن'; svg.appendChild(t0); return; }
  var max = niceMax(Math.max.apply(null, daily.map(function (d) { return d.km; }).concat([1])));
  [0, max / 4, max / 2, 3 * max / 4, max].forEach(function (v, i) {
    var y = H - pb - (v / max) * (H - pb - pt);
    svg.appendChild(svgEl('line', { x1: pl, x2: W - pr, y1: y, y2: y, stroke: i ? '#e1e0d9' : '#c3c2b7' }));
    var t = svgEl('text', { x: W - pr + 6, y: y + 4, 'font-size': 11, fill: '#898781' }); t.textContent = Math.round(v); svg.appendChild(t);
  });
  var nd = daily.length, iw = nd > 1 ? (W - pl - pr - 2 * ins) / (nd - 1) : 0;
  var pts = daily.map(function (d, i) { return [nd > 1 ? W - pr - ins - i * iw : (W - pr + pl) / 2, H - pb - (d.km / max) * (H - pb - pt)]; });
  if (nd > 1) svg.appendChild(svgEl('polyline', { fill: 'none', stroke: '#2a78d6', 'stroke-width': 2, points: pts.map(function (p) { return p.join(','); }).join(' ') }));
  var every = Math.ceil(nd / Math.max(1, Math.floor((W - pl - pr) / 46)));
  daily.forEach(function (d, i) {
    var p = pts[i];
    if (nd <= 31) svg.appendChild(svgEl('circle', { cx: p[0], cy: p[1], r: 4, fill: '#2a78d6', stroke: '#fff', 'stroke-width': 2 }));
    if (i % every === 0) { var t = svgEl('text', { x: p[0], y: H - 8, 'font-size': 11, fill: '#52514e', 'text-anchor': 'middle' }); t.textContent = dm(d.iso); svg.appendChild(t); }
    var w = nd > 1 ? iw : 60;
    var hit = svgEl('rect', { x: p[0] - w / 2, y: pt, width: w, height: H - pb - pt, fill: 'transparent' });
    dbInteract(hit, tipRows(dmy(d.iso), [['كيلومترات', fmtN(d.km)], ['تحصيل', fmtN(d.money) + ' ج']], 'مجموع كل مسؤولي التسليم في اليوم · دبل كليك: زيارات اليوم'),
      null, function () { dbDetails('زيارات ' + dmy(d.iso), function (v) { return v.iso === d.iso; }); });
    svg.appendChild(hit);
  });
}

document.getElementById('back').onclick = function () {
  if (S.chatOn) {
    if (S.user.role === 'admin' && S.chatCourier && !S.chatFromVisit) { S.chatCourier = null; showChat(); }
    else { S.chatOn = false; S.chatFromVisit = false; showList(); }
    return;
  }
  if (S.noteGeneral) { S.noteGeneral = false; showList(); }
  else if (S.sub) showVisit();
  else if (S.fromDash && S.key) { S.key = null; S.fromDash = false; if (S.dashSub && S.dashSubFn) S.dashSubFn(); else drawDashboard(S.dashD); }
  else if (S.dashSub) { S.dashSub = false; S.dashSubFn = null; drawDashboard(S.dashD); }
  else { S.fromDash = false; showList(); }
};
document.getElementById('refresh').onclick = function () { reload().catch(function () {}); };
document.getElementById('logout').onclick = function () { forget(); S.phone = ''; S.pin = ''; showLogin(); };
