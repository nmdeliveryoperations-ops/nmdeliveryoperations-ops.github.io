<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسليمات نهضة مصر</title>
<meta name="theme-color" content="#1f3864">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تسليمات نهضة مصر">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #f3f5f9; font-family: Tahoma, Arial, sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #1f3864; color: #fff; gap: 18px; transition: opacity .4s; z-index: 2; }
  #splash img { width: 110px; height: 110px; border-radius: 24px; }
  #splash b { font-size: 20px; }
  #splash small { opacity: .8; }
  #off { display: none; position: fixed; inset: 0; z-index: 3; background: #fff; color: #16233a;
         align-items: center; justify-content: center; text-align: center; padding: 24px; flex-direction: column; gap: 12px; }
  #off button { background: #1f3864; color: #fff; border: 0; border-radius: 10px; padding: 12px 24px; font-size: 16px; font-family: inherit; }
</style>
</head>
<body>
<div id="splash"><img src="icon-512.png" alt=""><b>تسليمات نهضة مصر</b><small>جاري التحميل...</small></div>
<div id="off"><b style="font-size:20px">مفيش إنترنت</b><div>اتأكد إن النت شغال وجرّب تاني.</div><button onclick="location.reload()">إعادة المحاولة</button></div>
<!-- السيستم نفسه (Google Apps Script) شغال جوه الصفحة دي -->
<iframe id="app" title="نظام التسليم"
  allow="geolocation *; camera *; clipboard-write *"
  src="https://script.google.com/macros/s/AKfycbxlZGQLBRp0zk06j5cwQjd5RUrB0vGwUXw_2rFxF-ETfyMDaDFWwjyQttKMTMjpPg7bBA/exec"></iframe>
<script>
  var sp = document.getElementById('splash');
  document.getElementById('app').addEventListener('load', function () {
    setTimeout(function () { sp.style.opacity = '0'; setTimeout(function () { sp.remove(); }, 400); }, 600);
  });
  function net() { document.getElementById('off').style.display = navigator.onLine ? 'none' : 'flex'; }
  addEventListener('online', net); addEventListener('offline', net); net();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
