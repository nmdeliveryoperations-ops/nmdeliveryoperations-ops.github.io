<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسليمات نهضة مصر</title>
<meta name="theme-color" content="#1f3864">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تسليمات نهضة مصر">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #f3f5f9; font-family: Tahoma, Arial, sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #1f3864; color: #fff; gap: 18px; transition: opacity .4s; z-index: 2; }
  #splash img { width: 110px; height: 110px; border-radius: 24px; }
  #splash b { font-size: 20px; }
  #splash small { opacity: .8; }
  #off { display: none; position: fixed; inset: 0; z-index: 3; background: #fff; color: #16233a;
         align-items: center; justify-content: center; text-align: center; padding: 24px; flex-direction: column; gap: 12px; }
  #off button { background: #1f3864; color: #fff; border: 0; border-radius: 10px; padding: 12px 24px; font-size: 16px; font-family: inherit; }
</style>
</head>
<body>
<div id="splash"><img src="icon-512.png" alt=""><b>تسليمات نهضة مصر</b><small>جاري التحميل...</small></div>
<div id="off"><b style="font-size:20px">مفيش إنترنت</b><div>اتأكد إن النت شغال وجرّب تاني.</div><button onclick="location.reload()">إعادة المحاولة</button></div>
<!-- السيستم نفسه (Google Apps Script) شغال جوه الصفحة دي -->
<iframe id="app" title="نظام التسليم"
  allow="geolocation *; camera *; clipboard-write *"
  src="https://script.google.com/macros/s/AKfycbxlZGQLBRp0zk06j5cwQjd5RUrB0vGwUXw_2rFxF-ETfyMDaDFWwjyQttKMTMjpPg7bBA/exec"></iframe>
<script>
  var sp = document.getElementById('splash');
  document.getElementById('app').addEventListener('load', function () {
    setTimeout(function () { sp.style.opacity = '0'; setTimeout(function () { sp.remove(); }, 400); }, 600);
  });
  function net() { document.getElementById('off').style.display = navigator.onLine ? 'none' : 'flex'; }
  addEventListener('online', net); addEventListener('offline', net); net();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
<!-- إشعارات الموبايل (Firebase Cloud Messaging) -->
<div id="ask" style="display:none;position:fixed;left:12px;right:12px;bottom:16px;z-index:4;background:#15203a;color:#fff;border-radius:16px;padding:14px;font-family:Tahoma,Arial,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.35)">
  <div style="font-size:15px;margin-bottom:10px">🔔 فعّل الإشعارات عشان توصلك رسايل الشات والردود على طول</div>
  <div style="display:flex;gap:8px">
    <button id="askYes" style="flex:1;background:#13a35a;color:#fff;border:0;border-radius:10px;padding:11px;font-size:15px;font-family:inherit">فعّل الإشعارات</button>
    <button id="askNo" style="background:transparent;color:#c9d3e8;border:1px solid #3b4a6e;border-radius:10px;padding:11px 14px;font-size:14px;font-family:inherit">مش دلوقتي</button>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script>
  var FB_CONFIG = {
    apiKey: "AIzaSyDskvnKAEBpp5N9u4FZ1cQB8FPJpV-VGLA",
    authDomain: "delivery-team-49321.firebaseapp.com",
    projectId: "delivery-team-49321",
    storageBucket: "delivery-team-49321.firebasestorage.app",
    messagingSenderId: "967652460258",
    appId: "1:967652460258:web:d7bea8cb0f69ba86c9c0bb"
  };
  var VAPID = "BDZq3iBGPTPaMcNosQljoXOXf2Jd5_-vbt_0pd3Ehhq4LdZmWUV3pF-qb0joOwjtkBmO3WumNFhmph-NQvZtmHY";
  var appWin = null, lastTok = null;
  function pushOk() {
    try { return 'serviceWorker' in navigator && 'Notification' in window && window.firebase && firebase.messaging.isSupported(); } catch (e) { return false; }
  }
  function sendTok(t) { lastTok = t; if (appWin) appWin.postMessage({ nm: 'token', token: t, device: navigator.userAgent }, '*'); }
  function getTok() {
    return navigator.serviceWorker.register('sw.js').then(function (reg) {
      return navigator.serviceWorker.ready.then(function () {
        return firebase.messaging().getToken({ vapidKey: VAPID, serviceWorkerRegistration: reg });
      });
    }).then(function (t) { if (t) sendTok(t); }).catch(function (e) { console.log('push token', e); });
  }
  var ask = document.getElementById('ask');
  document.getElementById('askNo').onclick = function () { ask.style.display = 'none'; try { localStorage.setItem('nmAskLater', String(Date.now())); } catch (e) {} };
  document.getElementById('askYes').onclick = function () {
    ask.style.display = 'none';
    Notification.requestPermission().then(function (p) { if (p === 'granted') getTok(); });
  };
  if (window.firebase) {
    try { firebase.initializeApp(FB_CONFIG); } catch (e) {}
    if (pushOk()) firebase.messaging().onMessage(function (p) {
      // الأبلكيشن مفتوح: نبلّغه يحدّث الشات بدل الإشعار
      if (appWin) appWin.postMessage({ nm: 'push', data: p && p.data }, '*');
    });
  }
  addEventListener('message', function (e) {
    if (!e.data || e.data.nm !== 'ready') return;
    appWin = e.source;
    if (!pushOk()) return;
    if (Notification.permission === 'granted') getTok();
    else if (Notification.permission === 'default') {
      var later = 0; try { later = Number(localStorage.getItem('nmAskLater') || 0); } catch (x) {}
      if (Date.now() - later > 864e5) ask.style.display = 'block';
    }
  });
</script>
</body>
</html>
